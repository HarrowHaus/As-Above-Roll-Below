name: Deploy AARB Preview

on:
  push:
    branches: [main]
    paths:
      - "engine/core/**"
      - "engine/client/**"
      - "assets/preproduction/dice/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build shared core
        working-directory: engine/core
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Build Phaser client
        working-directory: engine/client
        run: |
          npm install --no-audit --no-fund
          npm run build
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: engine/client/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
