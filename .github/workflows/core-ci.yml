name: Core Engine CI

on:
  push:
    paths:
      - "engine/core/**"
      - "engine/sim/**"
      - ".github/workflows/core-ci.yml"
  pull_request:
    paths:
      - "engine/core/**"
      - "engine/sim/**"

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: engine/core/package.json
      - name: Install core tooling
        working-directory: engine/core
        run: npm install --no-audit --no-fund
      - name: Build and test core
        working-directory: engine/core
        run: npm test
      - name: Headless simulator tests
        working-directory: engine/sim
        run: npm test
      - name: Shared-core simulation batch
        working-directory: engine/sim
        run: node src/run.mjs --runs=250 --output=results
      - name: Upload simulation telemetry
        uses: actions/upload-artifact@v4
        with:
          name: shared-core-simulation-${{ github.sha }}
          path: engine/sim/results/
          if-no-files-found: error
