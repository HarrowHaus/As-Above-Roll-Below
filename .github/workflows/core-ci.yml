name: AARB Engine CI

on:
  push:
    paths:
      - "engine/core/**"
      - "engine/sim/**"
      - "engine/client/**"
      - "assets/preproduction/dice/**"
      - ".github/workflows/core-ci.yml"
  pull_request:
    paths:
      - "engine/core/**"
      - "engine/sim/**"
      - "engine/client/**"
      - "assets/preproduction/dice/**"

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install core tooling
        working-directory: engine/core
        run: npm install --no-audit --no-fund
      - name: Build and test core
        working-directory: engine/core
        shell: bash
        run: set -o pipefail; npm test 2>&1 | tee core-test.log
      - name: Upload core test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-log-${{ github.sha }}
          path: engine/core/core-test.log
          if-no-files-found: warn
      - name: Headless simulator tests
        working-directory: engine/sim
        run: npm test
      - name: Shared-core simulation batch
        working-directory: engine/sim
        run: node src/run.mjs --runs=1000 --output=results
      - name: Upload simulation telemetry
        uses: actions/upload-artifact@v4
        with:
          name: shared-core-simulation-${{ github.sha }}
          path: engine/sim/results/
          if-no-files-found: error
      - name: Install Phaser client tooling
        working-directory: engine/client
        run: npm install --no-audit --no-fund
      - name: Build Phaser client
        working-directory: engine/client
        run: npm run build
      - name: Upload browser build
        uses: actions/upload-artifact@v4
        with:
          name: aarb-client-${{ github.sha }}
          path: engine/client/dist/
          if-no-files-found: error
